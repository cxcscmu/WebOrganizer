  Your task is to classify the underlying skill demonstrated in web pages into one of the following 48 categories:
  {choices}

  Definition of Skill: A skill is an internal cognitive ability that strongly influences how likely a person is to answer a question correctly. It is a learned capacity to achieve predetermined results with maximum certainty. The stronger the skill, the higher the chance the person will respond accurately, even across different but related questions.

  Choose which skill from the above list is the best match for describing the expertise required to understand or generate the content on the web page. If the content has multiple skills, choose the one that is most prominent.
  Remember to focus on the skill, and not the topic, e.g., a research paper about legal issues does not count as 'Legal and Regulatory Knowledge'.
  The URL might help you understand the content. Avoid shortcuts such as word overlap between the page and the skill descriptions or simple patterns in the URL, for example .../tutorials/... may also occur for theoretical discussions or general information.
  Start your response with the single-letter ID of the correct format followed by an explanation.
choices:
- |-
  Reading Comprehension and Text Analysis
   - The ability to understand, interpret, and extract meaning from written text across various genres and complexity levels
   - Examples: analyzing literary works, understanding technical documentation, interpreting news articles, extracting key information from research papers
- |-
  Grammar and Syntax Knowledge
   - Understanding of language structure, rules, and conventions that govern sentence formation and word relationships
   - Examples: identifying subject-verb agreement errors, understanding passive vs. active voice, recognizing proper sentence construction
- |-
  Language Generation and Writing Skills
   - The capacity to produce coherent, well-structured, and contextually appropriate written content
   - Examples: crafting professional emails, writing creative stories, producing technical reports, generating marketing copy
- |-
  Logical Reasoning and Inference
   - The ability to draw valid conclusions from given premises using systematic thinking processes
   - Examples: solving syllogisms, drawing conclusions from data, identifying cause-and-effect relationships
- |-
  Critical Thinking and Analysis
   - The skill of objectively evaluating information, arguments, and evidence to form reasoned judgments
   - Examples: analyzing political rhetoric, evaluating research methodology, assessing the credibility of sources
- |-
  Causal and Temporal Reasoning
   - Understanding relationships between cause and effect, as well as temporal sequences and time-based logic
   - Examples: understanding historical causation, predicting outcomes based on actions, analyzing timelines
- |-
  Abstract Reasoning and Generalization
   - The ability to identify patterns, relationships, and principles that apply across different contexts
   - Examples: understanding mathematical principles, identifying universal themes in literature, applying lessons from one domain to another
- |-
  Mathematical and Arithmetic Operations
   - Proficiency in basic and intermediate mathematical calculations and problem-solving
   - Examples: performing calculations, solving word problems, working with ratios and proportions
- |-
  Statistical Analysis and Data Interpretation
   - The ability to analyze numerical data, understand statistical concepts, and draw meaningful conclusions
   - Examples: interpreting survey results, analyzing experimental data, understanding polling margins of error
- |-
  Algebraic and Advanced Mathematical Reasoning
   - Proficiency in higher-level mathematical concepts including algebra, geometry, and calculus principles
   - Examples: solving algebraic equations, understanding geometric relationships, working with mathematical models
- |-
  Information Extraction and Synthesis
   - The skill of identifying, extracting, and combining relevant information from multiple sources
   - Examples: research compilation, creating literature reviews, combining data from multiple reports
- |-
  Summarization and Paraphrasing
   - The ability to condense information while preserving essential meaning and to restate content in different words
   - Examples: creating executive summaries, rewording complex instructions, condensing long articles
- |-
  Pattern Recognition and Categorization
   - The skill of identifying recurring themes, structures, or relationships and organizing information into meaningful groups
   - Examples: classifying species, identifying market trends, recognizing linguistic patterns
- |-
  Question Formulation and Answering
   - The ability to create meaningful questions and provide comprehensive, accurate responses
   - Examples: conducting interviews, creating survey questions, providing customer support responses
- |-
  Scientific Knowledge and Understanding
   - Comprehensive knowledge of scientific principles, methods, and findings across various scientific disciplines
   - Examples: explaining natural phenomena, understanding experimental design, discussing scientific discoveries
- |-
  Medical and Healthcare Knowledge
   - Specialized understanding of medical terminology, conditions, treatments, and healthcare systems
   - Examples: explaining medical conditions, understanding treatment options, interpreting health information
- |-
  Legal and Regulatory Knowledge
   - Understanding of legal principles, regulations, and procedures across various jurisdictions and practice areas
   - Examples: understanding contract law, explaining legal procedures, interpreting regulations
- |-
  Cultural Awareness and Sensitivity
   - Understanding and appreciation of diverse cultural backgrounds, customs, and perspectives
   - Examples: understanding cultural holidays, recognizing communication styles, adapting content for different audiences
- |-
  Historical and Geographical Knowledge
   - Comprehensive understanding of historical events, geographical features, and their interconnections
   - Examples: explaining historical conflicts, understanding geographic influences on culture, connecting past and present events
- |-
  Technical and Programming Knowledge
   - Understanding of technology concepts, programming languages, and technical systems
   - Examples: explaining programming concepts, troubleshooting technical issues, understanding software architecture
- |-
  Database Operations and SQL
   - Proficiency in database management systems and Structured Query Language for data manipulation
   - Examples: writing SQL queries, designing database schemas, optimizing database performance
- |-
  Social and Emotional Intelligence
   - The ability to understand and navigate social situations and emotional dynamics
   - Examples: reading social situations, understanding group dynamics, facilitating team interactions
- |-
  Empathy and Perspective Taking
   - The capacity to understand and share the feelings and viewpoints of others
   - Examples: providing emotional support, understanding different viewpoints in conflicts, showing compassion
- |-
  Conversational Dynamics and Dialogue Management
   - The skill of managing and facilitating effective conversations and discussions
   - Examples: moderating discussions, maintaining conversation threads, managing group conversations
- |-
  Sentiment Analysis and Emotion Recognition
   - The ability to identify and interpret emotional content and sentiment in text and communication
   - Examples: analyzing customer feedback, understanding emotional tone in messages, identifying mood in writing
- |-
  Hate Speech and Offensive Language Detection
   - The capability to identify harmful, discriminatory, or offensive language and content
   - Examples: content moderation, identifying cyberbullying, recognizing discriminatory language
- |-
  Argument Analysis and Evaluation
   - The skill of examining arguments for logical structure, validity, and persuasiveness
   - Examples: evaluating debate arguments, analyzing persuasive essays, identifying weak reasoning
- |-
  Fact-Checking and Verification
   - The ability to verify the accuracy of claims and information against reliable sources
   - Examples: verifying news claims, checking statistical accuracy, identifying false information
- |-
  Coherence and Cohesion Assessment
   - The skill of evaluating how well ideas connect and flow within text or communication
   - Examples: editing for flow, improving paragraph organization, ensuring logical progression
- |-
  Contradiction and Entailment Recognition
   - The ability to identify when statements contradict each other or when one statement logically follows from another
   - Examples: identifying contradictory evidence, recognizing logical implications, spotting inconsistent arguments
- |-
  Creative Writing and Storytelling
   - The ability to craft engaging narratives, develop characters, and create compelling fictional or creative content
   - Examples: writing short stories, developing plot lines, creating engaging characters, crafting poetry
- |-
  Literary Analysis and Interpretation
   - The skill of analyzing and interpreting literary works, including themes, symbols, and literary devices
   - Examples: analyzing symbolism in novels, interpreting poetry, understanding literary movements
- |-
  Humor and Wordplay Recognition
   - The ability to identify, understand, and appreciate various forms of humor and linguistic creativity
   - Examples: understanding puns, recognizing sarcasm, appreciating satirical content, identifying witty remarks
- |-
  Negotiation and Conflict Resolution
   - The skill of mediating disputes and finding mutually beneficial solutions to conflicts
   - Examples: mediating workplace disputes, facilitating discussions, finding win-win solutions
- |-
  Decision Making and Judgment
   - The ability to evaluate options, weigh pros and cons, and make sound decisions based on available information
   - Examples: evaluating investment options, making strategic choices, weighing alternatives
- |-
  Memory and Factual Recall
   - The capacity to store, retain, and retrieve factual information accurately
   - Examples: recalling historical dates, remembering scientific facts, accessing learned vocabulary
- |-
  Attention to Detail and Precision
   - The skill of noticing small but important elements and maintaining accuracy in work
   - Examples: proofreading for errors, checking calculations, maintaining accuracy in data entry
- |-
  Error Detection and Correction
   - The ability to identify mistakes, inconsistencies, and problems in various types of content or processes
   - Examples: editing written work, debugging code, identifying calculation errors, spotting inconsistencies
- |-
  Sequential Processing and Ordering
   - The skill of organizing information, events, or processes in logical temporal or hierarchical sequences
   - Examples: organizing instructions, creating timelines, sequencing procedures, prioritizing tasks
- |-
  Data Processing and Manipulation
   - The ability to work with large amounts of information, transforming and organizing it for analysis
   - Examples: cleaning datasets, reformatting information, aggregating data, creating data visualizations
- |-
  Comparative Analysis and Evaluation
   - The skill of examining similarities and differences between options, concepts, or alternatives
   - Examples: comparing products, evaluating alternatives, analyzing competing theories, assessing options
- |-
  Relevance Assessment and Filtering
   - The ability to determine what information is pertinent to a specific context or question
   - Examples: selecting relevant research sources, filtering search results, identifying pertinent details
- |-
  Parts of Speech Recognition and Tagging
   - The technical skill of identifying and categorizing words according to their grammatical functions
   - Examples: identifying nouns, verbs, adjectives, understanding grammatical parsing, language processing
- |-
  Punctuation and Formatting Skills
   - Proficiency in proper punctuation usage and document formatting conventions
   - Examples: proper comma usage, citation formatting, document structure, style consistency
- |-
  Vocabulary and Lexical Knowledge
   - Comprehensive understanding of word meanings, usage, and relationships across various domains
   - Examples: understanding technical terminology, recognizing word relationships, using appropriate vocabulary
- |-
  Business and Financial Understanding
   - Knowledge of business principles, financial concepts, and economic relationships
   - Examples: understanding profit margins, interpreting financial statements, analyzing market trends
- |-
  Research and Knowledge Retrieval
   - The skill of efficiently finding, accessing, and utilizing information from various sources
   - Examples: conducting literature searches, using databases, evaluating source credibility, synthesizing research
- |-
  General Problem Solving
   - The overarching ability to approach complex challenges systematically and develop effective solutions
   - Examples: troubleshooting issues, developing solutions to complex challenges, systematic approach to unknown problems
